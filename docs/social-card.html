<!doctype html>
<!--
  Source for docs/social-preview.png, the image GitHub shows when the repo link is shared
  (Settings → General → Social preview). The question is one Interviewly asks about the
  example project. Re-render with:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1280,640 --screenshot=docs/social-preview.png "file://$PWD/docs/social-card.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interviewly social preview</title>
<style>
  :root {
    --bg: #15161a;
    --panel: #1b1d22;
    --line: rgba(255, 255, 255, 0.09);
    --text: #ececef;
    --muted: #8d93a0;
    --soft: #b8bec9;
    --accent: #d97757;
    --code: #f2c48d;
    --ui: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; background: var(--bg); }
  body { font-family: var(--ui); color: var(--text); -webkit-font-smoothing: antialiased;
         padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .brand svg { width: 52px; height: 52px; display: block; }

  h1 { font-size: 84px; line-height: 1.04; font-weight: 700; letter-spacing: -0.035em; }
  h1 span { color: var(--accent); }
  .sub { margin-top: 22px; font-size: 30px; line-height: 1.35; color: var(--soft); letter-spacing: -0.01em; }

  .ask { display: flex; align-items: baseline; gap: 18px; padding: 22px 28px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 16px; font-size: 25px; line-height: 1.4; }
  .ask b { flex: none; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  code { font-family: var(--mono); font-size: 0.88em; color: var(--code); background: rgba(242, 196, 141, 0.1);
         padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M136 108h240a52 52 0 0 1 52 52v150a52 52 0 0 1-52 52H226l-74 62a10 10 0 0 1-16.4-7.7V362a52 52 0 0 1-51.6-52V160a52 52 0 0 1 52-52z" fill="#d97757"/>
      <g fill="none" stroke="#15161a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
        <path d="M196 182l-54 53 54 53"/>
        <path d="M316 182l54 53-54 53"/>
        <path d="M276 166l-40 138"/>
      </g>
    </svg>
    Interviewly
  </div>

  <div>
    <h1>You built it.<br><span>Now explain it.</span></h1>
    <p class="sub">Mock interviews about your own code, in Claude Code, Codex and Antigravity.</p>
  </div>

  <div class="ask">
    <b>Interviewer</b>
    <span>Your routes are <code>async def</code> but the session is sync. What happens under load?</span>
  </div>
</body>
</html>
